<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Хлеб на закваске</title>
    <link rel="stylesheet" href="css/style.css?v=5">
    <link rel="stylesheet" href="css/auth.css?v=5">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">🍞 Хлеб на закваске</a>
            <ul class="nav-links">
                <li><a href="/">Главная</a></li>
                <li><a href="/recipes.html">Рецепты</a></li>
                <li><a href="/starter.html">Закваска</a></li>
                <li class="requires-auth"><a href="/add-recipe.html">➕ Добавить рецепт</a></li>
                <li class="auth-links"></li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>✨ Регистрация</h1>
                    <p>Создайте аккаунт, чтобы добавлять рецепты и оставлять комментарии</p>
                </div>

                <form id="registerForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">👤 Имя пользователя</label>
                        <input type="text" id="username" required minlength="3"
                               placeholder="Введите имя пользователя">
                        <small>Минимум 3 символа</small>
                    </div>

                    <div class="form-group">
                        <label for="email">📧 Email</label>
                        <input type="email" id="email" required placeholder="Введите email">
                    </div>

                    <div class="form-group">
                        <label for="password">🔒 Пароль</label>
                        <input type="password" id="password" required minlength="8"
                               placeholder="Минимум 8 символов">
                        <small>Минимум 8 символов</small>
                    </div>

                    <div class="form-group">
                        <label for="confirm_password">🔒 Подтвердите пароль</label>
                        <input type="password" id="confirm_password" required
                               placeholder="Повторите пароль">
                    </div>

                    <div id="message" class="auth-message"></div>

                    <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
                </form>

                <div class="auth-footer">
                    <p>Уже есть аккаунт? <a href="/login.html">Войти</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Хлеб на закваске. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/auth-check.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
