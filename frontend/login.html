<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Хлеб на закваске</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="/" class="logo">🍞 Хлеб на закваске</a>
            <ul class="nav-links">
                <li><a href="/">Главная</a></li>
                <li><a href="/recipes.html">Рецепты</a></li>
                <li><a href="/starter.html">Закваска</a></li>
                <li><a href="/add-recipe.html">➕ Добавить рецепт</a></li>
                <li class="auth-links">
                    <a href="/login.html" id="loginLink">Вход</a>
                    <a href="/register.html" id="registerLink">Регистрация</a>
                </li>
            </ul>
        </div>
    </nav>

    <section class="auth-section">
        <div class="container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>🔐 Вход</h1>
                    <p>Войдите в свой аккаунт</p>
                </div>
                
                <form id="loginForm" class="auth-form">
                    <div class="form-group">
                        <label for="username">👤 Имя пользователя</label>
                        <input type="text" id="username" required placeholder="Введите имя пользователя">
                    </div>
                    
                    <div class="form-group">
                        <label for="password">🔒 Пароль</label>
                        <input type="password" id="password" required placeholder="Введите пароль">
                    </div>
                    
                    <div id="message" class="auth-message"></div>
                    
                    <button type="submit" class="btn btn-primary btn-full">Войти</button>
                </form>
                
                <div class="auth-footer">
                    <p>Нет аккаунта? <a href="/register.html">Зарегистрироваться</a></p>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2026 Хлеб на закваске. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/login.js"></script>
</body>
</html>
